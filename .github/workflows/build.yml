name: Build FunkyMoose Amp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Manuell auslösbar (GitHub UI > Actions > Run workflow)
  workflow_dispatch:

jobs:
  # ============================================================
  # macOS: VST3 + AU + Standalone (Universal Binary)
  # ============================================================
  build-macos:
    name: macOS (VST3 + AU + Standalone)
    runs-on: macos-14   # Apple Silicon runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: juce_install
          key: juce-8.0.6-macos

      - name: Download & Install JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git juce_src
          cmake -S juce_src -B juce_build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/juce_install"
          cmake --build juce_build --target install --parallel

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/juce_install"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload VST3 (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: FunkyMooseAmp-macOS-VST3
          path: build/FUNKY_MOOSE_AMP_VST3_artefacts/Release/VST3/

      - name: Upload AU (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: FunkyMooseAmp-macOS-AU
          path: build/FUNKY_MOOSE_AMP_VST3_artefacts/Release/AU/

      - name: Upload Standalone (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: FunkyMooseAmp-macOS-Standalone
          path: build/FUNKY_MOOSE_AMP_VST3_artefacts/Release/Standalone/

  # ============================================================
  # Windows: VST3 + Standalone
  # ============================================================
  build-windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache JUCE
        id: cache-juce
        uses: actions/cache@v4
        with:
          path: juce_install
          key: juce-8.0.6-windows

      - name: Download & Install JUCE
        if: steps.cache-juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git juce_src
          cmake -S juce_src -B juce_build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}/juce_install"
          cmake --build juce_build --config Release --target install --parallel
        shell: pwsh

      - name: Configure
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${env:GITHUB_WORKSPACE}/juce_install"
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: pwsh

      - name: Upload VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: FunkyMooseAmp-Windows-VST3
          path: build/FUNKY_MOOSE_AMP_VST3_artefacts/Release/VST3/

      - name: Upload Standalone (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: FunkyMooseAmp-Windows-Standalone
          path: build/FUNKY_MOOSE_AMP_VST3_artefacts/Release/Standalone/
